# Builds waddle for every platform with DuckDB's own ci-tools, as DuckDB's community repository builds
# it, and on a v* tag publishes the builds to a kista channel (hugr-lab/extension-ci-tools'
# _kista_publish.yml) when the repository's KISTA_URL variable is set.
#
# DuckDB is the duckdb submodule's commit. When you move it, move the extension-ci-tools submodule
# and every duckdb/extension-ci-tools @<commit> and ci_tools_version below to one commit of the
# branch of the same DuckDB line (docs/UPDATING.md).
name: Distribution
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@3128ab7ebb8c607f5c3ab2fe8397f1dfb56942f5 # v2.0-cyanoptera
    with:
      ci_tools_version: 3128ab7ebb8c607f5c3ab2fe8397f1dfb56942f5
      extension_name: waddle

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@3128ab7ebb8c607f5c3ab2fe8397f1dfb56942f5 # v2.0-cyanoptera
    with:
      ci_tools_version: 3128ab7ebb8c607f5c3ab2fe8397f1dfb56942f5
      extension_name: waddle
      format_checks: 'format;tidy'

  # Each build goes to kista as it is: kista checks it and signs it with the channel's key. Each
  # request is signed with the publisher's SSH key, the KISTA_PUBLISHER_KEY secret (README.md).
  kista:
    name: Publish to kista
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.KISTA_URL != ''
    uses: hugr-lab/extension-ci-tools/.github/workflows/_kista_publish.yml@d5dfb68cf0c0b24fc49327c018a6947bb6f90573 # kista sdk-v0.2.0
    with:
      extension_name: waddle
      ci_tools_version: d5dfb68cf0c0b24fc49327c018a6947bb6f90573
      kista_url: ${{ vars.KISTA_URL }}
      tenant: ${{ vars.KISTA_TENANT }}
      channel: ${{ vars.KISTA_CHANNEL }}
      visibility: ${{ vars.KISTA_VISIBILITY || 'private' }}
      environment: ${{ vars.KISTA_ENVIRONMENT || '' }}
    secrets:
      KISTA_PUBLISHER_KEY: ${{ secrets.KISTA_PUBLISHER_KEY }}
